<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Órdenes - Gymratstore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="../css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="gr-admin-shell">
    <aside class="gr-admin-sidebar">
      <a class="navbar-brand d-block mb-4" href="../index.html">GYM<span class="text-accent-red">RAT</span>STORE</a>
      <nav class="nav flex-column gap-1">
        <a class="nav-link" href="index.html"><i class="bi bi-speedometer2 me-2"></i>Inicio</a>
        <a class="nav-link" href="productos.html"><i class="bi bi-box-seam me-2"></i>Productos</a>
        <a class="nav-link d-none" data-rol="Administrador" href="alumnos.html"><i class="bi bi-people me-2"></i>Alumnos</a>
        <a class="nav-link active" href="ordenes.html"><i class="bi bi-receipt me-2"></i>Órdenes</a>
        <hr class="border-secondary my-2" />
        <a class="nav-link" href="../index.html"><i class="bi bi-box-arrow-left me-2"></i>Volver a la tienda</a>
        <a class="nav-link" href="#" data-accion="cerrar-sesion" data-ir="../index.html"><i class="bi bi-power me-2"></i>Cerrar sesión</a>
      </nav>
    </aside>

    <div class="gr-admin-main">
      <div class="mb-4">
        <h1 class="mb-0">Órdenes</h1>
        <p class="text-muted-gr mb-0">Listado de compras realizadas en la tienda.</p>
      </div>

      <div class="gr-card p-3 mb-3">
        <input type="text" class="form-control form-control-sm" id="buscarOrden" placeholder="Buscar por N° de orden, RUN o nombre del alumno..." />
      </div>

      <div class="gr-card p-0">
        <div class="table-responsive">
          <table class="table table-gr align-middle mb-0">
            <thead>
              <tr>
                <th>N° Orden</th>
                <th>Alumno</th>
                <th>Fecha</th>
                <th>Productos</th>
                <th>Total</th>
                <th>Estado</th>
                <th class="text-end">Detalle</th>
              </tr>
            </thead>
            <tbody id="tablaOrdenes"></tbody>
          </table>
        </div>
      </div>
      <p class="text-muted-gr text-center py-4 d-none" id="sinOrdenes">No hay órdenes que coincidan con la búsqueda.</p>
    </div>
  </div>

  <!-- Modal detalle de orden -->
  <div class="modal fade" id="modalDetalleOrden" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content gr-card">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="tituloDetalleOrden">Orden</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="mb-1"><strong>Alumno:</strong> <span id="detalleOrdenAlumno"></span></p>
          <p class="mb-3"><strong>Fecha:</strong> <span id="detalleOrdenFecha"></span></p>
          <ul class="list-unstyled" id="detalleOrdenItems"></ul>
          <hr class="border-secondary" />
          <div class="d-flex justify-content-between fs-5">
            <strong>Total</strong>
            <strong class="text-accent-lime" id="detalleOrdenTotal"></strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="grToastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/carrito.js"></script>
  <script src="../js/comun.js"></script>
  <script src="../js/admin-ordenes.js"></script>
</body>
</html>
